# Merlint configuration for ocgtk.
# Agreed policy: E300 enabled (snake_case variant constructors), E4xx doc
# rules NOT adopted, clearly-N/A rule families disabled pending review.
# Run: `dune build @check` first (merlint reads .cmt/.cmti), then `merlint`.

# --- Thresholds (tune after the first compliance report) ---------------------
max-complexity = 15          # cyclomatic complexity (merlint default 10)
max-function-length = 100    # lines of logic (merlint default 50)
# max-nesting left at merlint default (4); our prose guideline of 2 maps
# poorly to merlint's metric (else-if chains and data literals are flat).
# Tighten after reviewing the report.

# --- Allowed-libraries policy enforced at the source level (E221) -----------
# E221 (a source-text rule) only actually fires for Str on this codebase — it
# silently exempts Printf/Format even when listed (verified: 0 findings), and
# Obj/Marshal are better caught by their dedicated E100/E101 rules. So we ban
# only Str here; the Printf/Format -> Fmt modernization is driven by E205 (522
# findings), and Obj/Marshal by E100/E101.
disallowed_modules = ["Str"]

# E942 (disallowed_libraries) left empty for now: no build-level library ban.

# --- Rule exclusions --------------------------------------------------------

# Auto-generated bindings (ocgtk/src/*/generated/) are checked into the tree
# but regenerated by gir_gen. We have decided NOT to lint or fix them — the
# exclusion below is permanent, not pending review. Lint gates hand-written
# code only (gir_gen source/tests + ocgtk hand-written modules).
[[rules]]
files = ["**/generated/**"]
exclude = ["*"]

# Do NOT adopt the E4xx documentation rules (project decision).
# Disable the E325/E331 naming rules: both are far too noisy for this codebase
# (E331 alone was 4633 findings) and conflict with established usage; review later.
# `files = "**"` so the exclusion covers every file type these rules touch.
[[rules]]
files = "**"
exclude = ["E400", "E405", "E410", "E415", "E420", "E425", "E325", "E331"]

# Rule families that do not apply to this project; to be reviewed later.
# Only the genuinely-N/A protocol/codec/wire/monopam rules are excluded here.
# Kept ENABLED because they apply to any opam/dune project: E912 (pkg layout),
# E913 (pkg metadata), E920-E923 (mdx docs), E940 (dune-warnings),
# E941-E944 (opam hygiene), E956 (dead library dep).
[[rules]]
files = "**"
exclude = [
  "E510",   # Logs.Src — we do not use the Logs library
  "E520",   # lib/ not src/ — our layout is ocgtk/ + gir_gen/
  "E522",   # package-prefixed module in lib/ — no lib/ directory
  # Fuzz (E7xx) — no fuzz targets
  "E700", "E705", "E710", "E715", "E718", "E720", "E721",
  "E722", "E724", "E725", "E726", "E727",
  # Interop trace testing (E8xx) — not our testing model
  "E800", "E801", "E802", "E803", "E805", "E806", "E807",
  "E810", "E815", "E816", "E820", "E825", "E830", "E835",
  # Wire / codec / protocol shape + monopam — targets ocaml-clcw-style packages.
  "E900", "E905", "E910", "E915", "E930", "E931", "E932",
  "E945", "E946", "E947", "E948", "E949",
  "E950", "E951", "E952", "E953", "E954", "E955",
]

# E500/E525/E940 for paths that have NO dune-project: the workspace root
# (repo has only dune-workspace, no root dune-project, by design) and conf-gtk4
# (a virtual system package with no dune build). E525/E940 (dune-warnings env
# stanza) and E500 (missing .ocamlformat) are structural false positives
# here — creating a `dune` or root `.ocamlformat` there is wrong (it makes
# dune/ocamlformat warn about a missing dune-project, and neither path is a
# formatting scope: ocgtk/ and gir_gen/ each carry their own .ocamlformat).
# The real package roots (ocgtk/, gir_gen/) carry the env stanza in their own
# dune files and stay checked.
[[rules]]
files = ["dune", "conf-gtk4/dune", ".ocamlformat", "conf-gtk4/.ocamlformat"]
exclude = ["E500", "E525", "E940"]

# --- ocgtk hand-written-code exclusions --------------------------------------
#
# These are deliberate project decisions, not "N/A" rules. Each block below
# explains *why the lint finding is real but the fix is out of scope here* —
# either it is a structural migration that would break the generator/build, a
# project convention merlint does not model, or a coverage/naming effort that
# belongs in its own workstream. Every one is reversible: drop the block to
# re-enable the rule.
#
# Scope note: the fmt-related block is scoped to `ocgtk/**` so it does NOT
# suppress gir_gen findings (gir_gen has its own Printf→Fmt migration tracked
# separately). The generated/ tree is already excluded wholesale by the first
# block above, so it is not double-counted.

# fmt is not adopted as an ocgtk dependency, so the rules that push toward fmt
# are not enforced for ocgtk hand-written code:
#   E205 — Printf/Format → Fmt. Fixing it requires adding `fmt` to ocgtk.opam,
#          which is not approved (the bindings deliberately stay stdlib-only
#          for formatting). The 60 hand-written Printf/Format sites are left
#          as-is; the rule is deferred until fmt is adopted.
#   E217/E340/E218/E616 — the Fmt-helper family (Fmt.kstr wrappers, err_/fail_
#          helpers, Alcotest.failf-vs-Fmt.str). These only fire on Fmt usage;
#          with E205 deferred there is no Fmt usage in ocgtk to trigger them,
#          but they are excluded alongside E205 to state the policy clearly
#          and keep ocgtk clean if fmt is ever used incidentally.
# Scoped to ocgtk/** so gir_gen's own fmt findings are not suppressed.
[[rules]]
files = ["ocgtk/**"]
exclude = ["E205", "E217", "E340", "E218", "E616"]

# Package layout (E912): wants code under lib/ / bin/ / test/, but ocgtk is a
# multi-root dune-workspace whose hand-written tree is src/<namespace>/ and
# whose generated tree is src/<namespace>/generated/ (gir_gen emits there).
# Reorganising into lib/ would mean regenerating into lib/<ns>/, updating
# gir_gen's output paths, the dune-workspace multi-root wiring, and every CI
# path — a dedicated migration, not a lint touch. Excluded globally (gir_gen
# uses the compliant lib/bin/test layout and has no E912 findings, so this
# only suppresses ocgtk's 14 src/*/dune findings).
[[rules]]
files = "**"
exclude = ["E912"]

# Standalone-test-executable convention (E600/E610/E620/E515/E523 + E505 for
# test modules): ocgtk ships each test as its OWN (test ...) stanza that calls
# Alcotest.run directly and runs as a separate executable. This is deliberate
# — the FFI/GC-stress tests (closures, GValue lifecycle, signal marshalling)
# can segfault, and one crashing must not abort the whole suite. merlint's
# E600/E610/E620 instead assume the "library of test suites + a single test.ml
# runner" layout, E515/E523 assume libs and tests never share a directory, and
# E505 wants an .mli per compiled module. Consolidating to one runner would
# regress fault isolation, so the rules are not applied to test/example dirs.
# (The two hand-written test helper libraries, gtk_test_helpers and
# gobject_test_helpers, DO carry .mli files — E505 is satisfied there.)
[[rules]]
files = ["ocgtk/tests/**", "ocgtk/examples/**"]
exclude = ["E505", "E600", "E610", "E620", "E515", "E523"]

# Untested modules (E605): the 16 findings are hand-written core modules
# (gobject, glib, gError, the bounded-int Int8/16/32 and UInt8/16/32/64,
# gsize, ocgtk_common, the gio/gtk cores). Clearing E605 means writing real
# adversarial test suites for each — a coverage initiative with its own
# design work, not a lint remediation step. Tracked separately; excluded so
# it does not gate the lint job. (Bounded_int already has test_bounded_int;
# the gap is the GObject/Glib/enum cores.)
[[rules]]
files = "**"
exclude = ["E605"]

# Naming renames (E332 create→v, E305 CamelCase module, E330 redundant
# prefix, E333 <dst>_from_<src>→<dst>_of_<src> conversion naming, E334
# redundant record-field prefixes): each finding is an API-BREAKING rename
# of a public binding (e.g. Gobject.Value.create, Glib.Main.create,
# Glib.glib_init) or, for gir_gen, of internal generator/test helpers. Like
# the already-deferred E300 variant rename, these belong in a single
# coordinated migration with deprecations, not a lint pass. E305 is
# additionally a false positive: it flags GdkPixbuf and PangoCairo, which
# intentionally mirror their upstream C library names (GdkPixbuf-2.0,
# PangoCairo-1.0). gir_gen's E333/E334 sites (c_ast/c_parser/ml_ast_helpers
# conversion names, entity_generators/c_param field prefixes) are internal
# but are folded into the same migration slot rather than half-renamed.
[[rules]]
files = "**"
exclude = ["E332", "E305", "E330", "E333", "E334"]

# mdx (E920): wants (mdx (files ...)) stanzas so README/.mli OCaml blocks are
# type-checked and run. ocgtk/README.md and src/gtk/core/gMain.mli have code
# blocks, but they are illustrative snippets that are not standalone-
# compilable as-is, and wiring mdx is a separate integration task (new opam
# dep, mdx stanzas, snippet cleanup). Deferred.
[[rules]]
files = "**"
exclude = ["E920"]

# --- gir_gen hand-written-code exclusions ------------------------------------
#
# Mirrors the ocgtk blocks above for gir_gen. gir_gen is a build-time code
# generator; its only public surface is the `gir_gen` CLI. The internal lib/
# modules now carry .mli files (E505 cleared), but several structural /
# naming-migration rules still fire on the generator and its tests and are
# deferred here for the same reasons as their ocgtk counterparts.

# Long/complex generator-core functions in gir_gen/lib (E005/E001/E010):
# the current merlint engine analyses gir_gen/lib fully, surfacing
# pre-existing shape findings in the generator's core emitters that were
# invisible to the engine the lint job originally ran. These mirror the
# gir_gen/bin E005 rationale: the functions flagged are the generator's
# core emission/parse logic, not hand-written application code:
#   E005 — parse_gir_file (gir_parser.ml, ~1060 lines: the XML fold of the
#          whole GIR document), generate_method_wrappers,
#          generate_class_module_body / _signature_body, generate_dune_library,
#          generate_decls_header. Splitting each is a real refactor of the
#          generator, tracked separately.
#   E001 — generate_array_ml_to_c / generate_array_c_to_ml /
#          generate_method_wrappers: cyclomatic complexity driven by the
#          per-type conversion dispatch they must encode, not by incidental
#          branching debt.
#   E010 — nesting depth in the same class-gen emitters (match on
#          (type-kind, nullability, ownership) triples).
# E320 (identifier underscore count) on gir_gen/lib: the flagged names are
# the deliberately descriptive emitter names (find_type_mapping_for_gir_type,
# calculate_class_or_interface_or_record_module_name, ...) shared across the
# c_stub/class_gen/layer1 emitters — same rationale as gir_gen/bin below.
# The types.ml findings (get_type_func__019_, cr_c_type__031_, ...) are not
# hand-written at all: they are ppx_deriving sexp-internal expansion names,
# i.e. false positives.
# Note: E217 in gir_gen/lib is NOT excluded wholesale — the mechanical
# Fmt.kstr/Fmt.failwith/Fmt.error sites were fixed in code. Only the three
# buffer-based c_stub emitter files carry a narrow per-file exclusion below
# (formatter-hoist perf hints).
[[rules]]
files = ["gir_gen/lib/**"]
exclude = ["E001", "E005", "E010", "E320"]

# Formatter-hoist perf hints (E217) in the buffer-based c_stub emitters:
# these emit into a Buffer via Gen_buffer.bprintf inside per-element loops;
# merlint suggests hoisting Fmt.with_buffer out of the loop. gir_gen is a
# build-time tool run once per generation, so the perf is non-critical and
# the current shape keeps the emit sites readable — same rationale as the
# gir_gen/bin E217 exclusion.
[[rules]]
files = ["gir_gen/lib/generate/c_stubs.ml", "gir_gen/lib/generate/c_stub_constructor.ml", "gir_gen/lib/generate/c_stub_helpers.ml"]
exclude = ["E217"]

# gen_buffer.ml (E205): the shared bprintf helper intentionally uses
# Format.kfprintf — Fmt has no bprintf-with-buffer equivalent (Fmt.with_buffer
# cannot take a format continuation), and the flush semantics of
# Format.formatter_of_buffer require the explicit kfprintf flush. The file's
# own comment documents this. Converting it to Fmt is not possible without
# changing call-site semantics, so E205 is excluded for this one file.
[[rules]]
files = ["gir_gen/lib/gen_buffer.ml"]
exclude = ["E205"]

# E300 (CamelCase variant constructors): the plan keeps E300 enabled as the
# todo list for the project-wide CamelCase→snake_case variant rename. The 6
# gir_gen findings (c_ast.ml IntLiteral/StringLiteral/AddrOf/VarDecl/ExprStmt/
# IfStmt, mirrored in c_ast.mli) are test-internal, but the rename is
# coordinated with ocgtk's variants (the generated bindings and the test AST
# share names), so it is deferred to the same migration slot rather than
# half-done here. Scoped to gir_gen/** so ocgtk (already 0) keeps the rule.
[[rules]]
files = ["gir_gen/**"]
exclude = ["E300"]

# Standalone-test-executable convention for gir_gen: gir_gen splits tests into
# two (test ...) executables so the integration suite can depend on
# gir_gen.exe and run subprocess generation separately from the pure unit
# suite. E610 (test file with no library module), E620 (a single test stanza
# per directory) and E505 (test module missing .mli) assume the single-runner
# layout; all three are false positives for these executables, exactly as for
# ocgtk/tests/** — and the fault-isolation argument from the ocgtk block
# applies equally (one crashing suite must not abort the other). (The
# test_gir_gen_helpers support library modules DO carry .mli files — E505 is
# satisfied there.)
[[rules]]
files = ["gir_gen/test/**"]
exclude = ["E505", "E610", "E620"]

# Code-generator structural rules — gir_gen/bin/gir_gen.ml is a single
# executable that emits the whole binding tree; several of its functions
# and its CLI shape are inherently large. These are not lint debt but the
# shape of a code generator, and the fixes are separate refactors:
#   E005 — generate_bindings (475 lines), generate_c_stub (308),
#          entity_generator_by_entity_type (159), generate_overrides (153),
#          generate_references (112), generate_enum_files (104). Splitting
#          each is a real refactor of the generator's core, tracked
#          separately. gir_gen/lib's generator-core emitters carry the same
#          findings (excluded in the gir_gen/lib block above, which also
#          covers E001/E010/E320 for the lib emitters).
#   E217 — Fmt.str perf hint (hoist a formatter out of the loop). gir_gen is a
#          build-time tool run once per generation; the perf is non-critical
#          and Fmt.str keeps the emitters readable. (fmt IS adopted in
#          gir_gen, so E205 is not deferred here — only the perf hint.)
#   E320 — 5-underscore identifier names (emit_os_fallback_property_getter_stub,
#          ..._setter_stub, from_gobject_c_name_for_entity). These are
#          deliberately descriptive emitter names; shortening them below the
#          4-underscore cap would hurt clarity more than it helps.
#   E524 — 3 Cmdliner subcommands in one file. gir_gen is a single-purpose
#          binary; splitting subcommands into per-file modules is a layout
#          refactor, not a correctness fix.
# Scoped to gir_gen/bin/** so gir_gen/lib and gir_gen/test keep all four rules.
[[rules]]
files = ["gir_gen/bin/**"]
exclude = ["E005", "E217", "E320", "E524"]

# Per-file whitelists (intentional, narrow, explained in the file itself):

# test_gobject_equality.ml exists to verify that the ocgtk_gobject_ops custom
# block installs a polymorphic (=)/hash that does pointer-identity — its
# assertions deliberately use Stdlib.(=). Replacing (=) with a typed .equal
# would test the wrong thing, so E106 is whitelisted for this one file.
[[rules]]
files = ["ocgtk/tests/gtk/test_gobject_equality.ml"]
exclude = ["E106"]

# test_signal_value_enum_flags.ml exercises the generated Rectangle decoder,
# which the generated ocgtk_gdk.ml wrapper does NOT re-export (only Gdk /
# Gdk_enums / Gdk_constants are re-exported). The Ocgtk_gdk__Rectangle
# internal path is the only route to it; editing the generated wrapper is out
# of scope, so E210 is whitelisted for this one file. (The Gtk_enums and
# Gdk_enums accesses WERE migrated to their re-exported public paths.)
[[rules]]
files = ["ocgtk/tests/gtk/test_signal_value_enum_flags.ml"]
exclude = ["E210"]