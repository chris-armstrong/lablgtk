name: CI
on:
  push:
    branches: [main]
  pull_request:
# CI Notes:
# - octk: GTK 4 support is under development, failures expected

jobs:

  build-ocgtk:
    name: Build ocgtk (GTK 4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: [5.4.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev xdot xvfb

      - name: Pin conf-gtk4 package
        run: opam pin add -n conf-gtk4 conf-gtk4

      - name: Install OCaml dependencies
        run: |
          opam install ./ocgtk ./gir_gen --deps-only --with-test

      # --check exits non-zero if any gir_gen source would be reformatted.
      - name: Check gir_gen formatting
        run: |
          opam exec -- ocamlformat --check \
            $(git ls-files 'gir_gen/*.ml' 'gir_gen/*.mli')

      - name: Build
        run: opam exec -- dune build

      - name: Test gir_gen package
        run: opam exec -- dune test gir_gen/

      - name: Test ocgtk package
        run: |
          # Use xvfb-run to provide virtual display for GTK runtime tests
          opam exec -- xvfb-run -a dune test ocgtk/

  # ── Lint (merlint + semgrep) — HARD GATE ───────────────────────────────────
  # Runs merlint (docs/code_guidelines policy in merlint.toml) and semgrep
  # (banned partial functions in .semgrep/banned-partials.yml) and FAILS the
  # workflow on any non-excluded finding. Uploads JSON reports on failure too
  # (the `if: always()` upload step) so a red run is debuggable.
  #
  # Gate signals:
  #   semgrep  — `--error` makes it exit non-zero on findings; we gate on that
  #              exit code directly (semgrep is text-based, no merlint caveats).
  #   merlint  — its EXIT CODE IS NOT THE GATE. merlint exits non-zero on every
  #              scan of this multi-root workspace because the §7 "stale .cmt"
  #              warning fires (it cannot resolve the wrapped-private
  #              gir_gen_lib path; ~10 ocgtk files are skipped too). The
  #              warning is benign and documented in the lint-remediation plan
  #              §7. We instead gate on the JSON report's `passed` field
  #              (true iff zero non-excluded findings) via the python check.
  #              Re-enable rules by editing merlint.toml; this job will then
  #              turn red on the new findings.
  lint:
    name: Lint (merlint + semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.x
          dune-cache: true

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev

      - name: Pin conf-gtk4 package
        run: opam pin add -n conf-gtk4 conf-gtk4

      - name: Install OCaml dependencies
        run: opam install ./ocgtk ./gir_gen --deps-only --with-test

      # merlint lives in the samoht opam overlay. It pulls a fair number of
      # transitive deps (merlin-lib, project-index, eio/tls/cohttp, ...); the
      # install adds a few minutes but is the only Linux install path today.
      - name: Install merlint
        run: |
          opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
          opam update
          opam install merlint --yes

      - name: Install semgrep
        run: python3 -m pip install semgrep

      # merlint reads .cmt/.cmti artefacts. `dune build @check` at the workspace
      # root builds ocgtk; gir_gen is a separate dune root, so build it too.
      - name: Build typed-tree artefacts (ocgtk + gir_gen)
        run: |
          opam exec -- dune build @check
          (cd gir_gen && opam exec -- dune build @check)

      - name: Run merlint
        run: |
          # merlint always exits non-zero here (the §7 stale-.cmt warning),
          # so `|| true` only on the report/summary lines — the python check
          # below is the actual gate (exits non-zero iff `passed` is false).
          opam exec -- merlint --json > merlint-report.json || true
          opam exec -- merlint || true
          python3 - <<'PY'
          import json, sys
          # merlint --json writes the report as a single JSON object on stdout,
          # but some merlint versions ALSO write the §7 "stale .cmt/.cmti" warning
          # to stdout *before* the JSON object (not to stderr). json.load() on the
          # whole file then fails on the leading "!" warning lines. Parse from the
          # first '{' and use raw_decode so any trailing bytes after the report
          # object are ignored.
          raw = open('merlint-report.json').read()
          idx = raw.find('{')
          if idx < 0:
              print('merlint: no JSON object found in merlint-report.json')
              sys.exit(2)
          d, _ = json.JSONDecoder().raw_decode(raw[idx:])
          print(f"merlint: {d['total_issues']} non-excluded issue(s); passed={d['passed']}")
          sys.exit(0 if d['passed'] else 1)
          PY
        # NOTE: merlint prints a "... typedtree-backed queries found a missing
        # or stale .cmt/.cmti file" warning for gir_gen/lib modules. This is a
        # KNOWN, BENIGN limitation, not stale artefacts: the .cmt files exist
        # and are fresh, but merlint's resolver cannot locate the wrapped-private-
        # library path for gir_gen_lib (private, include_subdirs qualified).
        # Typed-tree rules (E106, E300, E005, ...) still fire on gir_gen, so no
        # findings are missed. Do not chase this warning; the fix is upstream in
        # merlint. The warning (on stdout in some merlint versions, mixed with
        # the JSON report) is why we gate on the JSON `passed` field rather than
        # merlint's exit code, and why the parser above skips to the first '{'.

      - name: Run semgrep (banned partial functions)
        run: |
          semgrep --config .semgrep/banned-partials.yml --json --error \
            > semgrep-report.json
          semgrep --config .semgrep/banned-partials.yml --error .

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            merlint-report.json
            semgrep-report.json

  # ── macOS (Homebrew GTK4) ──────────────────────────────────────────────────
  # Validates the cmdliner --help=plain fix on macOS. Apple Silicon only
  # (macos-latest); macos-13 x86_64 runners no longer pick up public-repo jobs
  # reliably, so we can't mirror the opam-ci amd64 variant directly here — the
  # arm64 run still exercises the same cmdliner code path.
  build-ocgtk-macos:
    name: Build ocgtk (macOS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # arm64 — Apple Silicon
            ocaml-compiler: 5.4.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK4 via Homebrew
        run: |
          brew update
          brew install gtk4 gobject-introspection pkg-config cairo pango gdk-pixbuf

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Pin conf-gtk4 package
        run: opam pin add -n conf-gtk4 conf-gtk4

      - name: Install OCaml dependencies
        run: |
          opam install ./ocgtk --deps-only --with-test
          opam install ./gir_gen --deps-only --with-test

      - name: Build both packages
        run: opam exec -- dune build

      # Replicate opam-ci's non-TTY build-sandbox conditions:
      # stdout/stderr redirected (no isatty), TERM varied.
      - name: Run tests (opam-ci-style, TERM=dumb)
        env:
          TERM: dumb
        run: |
          opam exec -- dune test gir_gen/ 2>&1 | tee test-output-gir-gen.log
          opam exec -- dune test ocgtk/ 2>&1 | tee test-output.log

      - name: Run tests again with TERM=xterm-256color (CLI help regression check)
        env:
          TERM: xterm-256color
        run: |
          opam exec -- dune test --force ocgtk/ 2>&1 | tee test-output-xterm.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}-test-logs
          path: |
            test-output-gir-gen.log
            test-output.log
            test-output-xterm.log
            _build/default/gir_gen/test/_build/_tests/

