name: CI
on:
  push:
    branches: [main]
  pull_request:
# CI Notes:
# - octk: GTK 4 support is under development, failures expected

jobs:

  build-ocgtk:
    name: Build ocgtk (GTK 4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: [5.4.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev xdot xvfb

      - name: Pin conf-gtk4 package
        run: opam pin add -n conf-gtk4 conf-gtk4

      - name: Install OCaml dependencies
        run: |
          opam install ./ocgtk ./gir_gen --deps-only --with-test

      # --check exits non-zero if any gir_gen source would be reformatted.
      - name: Check gir_gen formatting
        run: |
          opam exec -- ocamlformat --check \
            $(git ls-files 'gir_gen/*.ml' 'gir_gen/*.mli')

      - name: Build
        run: opam exec -- dune build

      - name: Test gir_gen package
        run: opam exec -- dune test gir_gen/

      - name: Test ocgtk package
        run: |
          # Use xvfb-run to provide virtual display for GTK runtime tests
          opam exec -- xvfb-run -a dune test ocgtk/

  # ── Lint (merlint + semgrep) — HARD GATE ───────────────────────────────────
  # Runs merlint (docs/code_guidelines policy in merlint.toml) and semgrep
  # (banned partial functions in .semgrep/banned-partials.yml) and FAILS the
  # workflow on any non-excluded finding. Uploads JSON reports on failure too
  # (the `if: always()` upload step) so a red run is debuggable.
  #
  # Gate signals:
  #   semgrep  — `--error` makes it exit non-zero on findings; we gate on that
  #              exit code directly (semgrep is text-based, no merlint caveats).
  #   merlint  — EXIT CODE IS NOT THE GATE, and — since the Aug 2025 engine
  #              overhaul (merlint pinned at 960b091) — NEITHER IS THE `passed`
  #              FIELD: `passed` is now false whenever any file goes unanalyzed,
  #              and merlint's project-index cannot see ~97 files that dune
  #              genuinely compiles (the ocgtk generated/ modules claimed via
  #              `(include generated/*.inc)` stanzas, and
  #              gir_gen/test/corpus/signal_corpus* claimed by an explicit
  #              `(modules ...)` list — both confirmed by a passing dune build;
  #              `dune exec -- project-index stanzas -p <dir>` cannot list
  #              them). That unanalyzed set is merlint-side (its own warning
  #              calls it "a defect in merlint and not one of yours"); it is
  #              the successor of the old §7 "stale .cmt" warning. The gate
  #              therefore checks the report's actual signal: `total_issues`
  #              (non-excluded findings), `failed_checks` (rules that errored)
  #              and `build_failure`. The job prints the unanalyzed count so a
  #              change in it is visible; review the delta when it moves.
  #              Re-enable rules by editing merlint.toml; this job will then
  #              turn red on the new findings.
  lint:
    name: Lint (merlint + semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.x
          dune-cache: true

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev

      - name: Pin conf-gtk4 package
        run: opam pin add -n conf-gtk4 conf-gtk4

      - name: Install OCaml dependencies
        run: opam install ./ocgtk ./gir_gen --deps-only --with-test

      # merlint lives in the samoht opam overlay. It pulls a fair number of
      # transitive deps (merlin-lib, project-index, eio/tls/cohttp, ...); the
      # install adds a few minutes but is the only Linux install path today.
      # The overlay's merlint.dev builds from the repo's #main branch, which is
      # the only distribution (no tags/releases exist upstream). Between Aug 16
      # and Aug 30 2025 an unpinned `opam install merlint` picked up an engine
      # overhaul (~60 upstream commits) that silently changed which findings the
      # gate sees and broke it. Pin the exact upstream commit so lint results
      # stay reproducible; bump deliberately, never passively.
      - name: Install merlint
        run: |
          opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
          opam update
          opam pin add merlint git+https://tangled.org/gazagnaire.org/merlint#960b091 --yes
          opam install merlint --yes

      - name: Install semgrep
        run: python3 -m pip install semgrep

      # merlint reads .cmt/.cmti artefacts. `dune build @check` at the workspace
      # root builds ocgtk; gir_gen is a separate dune root, so build it too.
      - name: Build typed-tree artefacts (ocgtk + gir_gen)
        run: |
          opam exec -- dune build @check
          (cd gir_gen && opam exec -- dune build @check)

      - name: Run merlint
        run: |
          # merlint exits non-zero on every scan of this multi-root workspace
          # (the unanalyzed-files warning, see the gate-signals note above), so
          # `|| true` on the merlint lines — the python check below is the
          # actual gate.
          opam exec -- merlint --json > merlint-report.json || true
          opam exec -- merlint || true
          python3 - <<'PY'
          import json, sys
          # merlint --json writes the report as a single JSON object on stdout,
          # but it ALSO writes the "claimed by no dune stanza" warning to
          # stdout *before* the JSON object (not to stderr). json.load() on the
          # whole file then fails on the leading "!" warning lines. Parse from
          # the first '{' and use raw_decode so any trailing bytes after the
          # report object are ignored.
          raw = open('merlint-report.json').read()
          idx = raw.find('{')
          if idx < 0:
              print('merlint: no JSON object found in merlint-report.json')
              sys.exit(2)
          d, _ = json.JSONDecoder().raw_decode(raw[idx:])
          unchecked = d.get('unchecked', 0)
          failed_checks = d.get('failed_checks') or []
          build_failure = d.get('build_failure')
          print(f"merlint: {d.get('total_issues')} non-excluded issue(s); "
                f"{unchecked} file(s) unanalyzed (project-index limitation, "
                f"documented above); failed_checks={len(failed_checks)}; "
                f"build_failure={build_failure}")
          ok = (d.get('total_issues', 0) == 0 and not failed_checks
                and not build_failure)
          sys.exit(0 if ok else 1)
          PY
        # NOTE: the new merlint engine (pinned at 960b091) analyzes every file
        # dune compiles via its own typedtree/project-index pass, but its
        # project-index cannot read module claims coming through
        # `(include generated/*.inc)` stanzas (ocgtk generated/ tree) or all
        # entries of explicit `(modules ...)` lists (gir_gen/test/corpus), so
        # it reports those ~97 files as "claimed by no dune stanza" and leaves
        # them unanalyzed. dune builds and tests them fine — this is merlint's
        # own stated defect category, not stale artefacts. All of these files
        # are either excluded from lint policy anyway (generated/**) or were
        # analyzed by the pre-overhaul engine; the delta is watched via the
        # printed count above. This warning is also why the gate reads the
        # parsed JSON (findings/failed_checks/build_failure) rather than
        # merlint's exit code or the `passed` field, and why the parser above
        # skips to the first '{'.

      - name: Run semgrep (banned partial functions)
        run: |
          semgrep --config .semgrep/banned-partials.yml --json --error \
            > semgrep-report.json
          semgrep --config .semgrep/banned-partials.yml --error .

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            merlint-report.json
            semgrep-report.json

  # ── macOS (Homebrew GTK4) ──────────────────────────────────────────────────
  # Validates the cmdliner --help=plain fix on macOS. Apple Silicon only
  # (macos-latest); macos-13 x86_64 runners no longer pick up public-repo jobs
  # reliably, so we can't mirror the opam-ci amd64 variant directly here — the
  # arm64 run still exercises the same cmdliner code path.
  build-ocgtk-macos:
    name: Build ocgtk (macOS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # arm64 — Apple Silicon
            ocaml-compiler: 5.4.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK4 via Homebrew
        run: |
          brew update
          brew install gtk4 gobject-introspection pkg-config cairo pango gdk-pixbuf

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Pin conf-gtk4 package
        run: opam pin add -n conf-gtk4 conf-gtk4

      - name: Install OCaml dependencies
        run: |
          opam install ./ocgtk --deps-only --with-test
          opam install ./gir_gen --deps-only --with-test

      - name: Build both packages
        run: opam exec -- dune build

      # Replicate opam-ci's non-TTY build-sandbox conditions:
      # stdout/stderr redirected (no isatty), TERM varied.
      - name: Run tests (opam-ci-style, TERM=dumb)
        env:
          TERM: dumb
        run: |
          opam exec -- dune test gir_gen/ 2>&1 | tee test-output-gir-gen.log
          opam exec -- dune test ocgtk/ 2>&1 | tee test-output.log

      - name: Run tests again with TERM=xterm-256color (CLI help regression check)
        env:
          TERM: xterm-256color
        run: |
          opam exec -- dune test --force ocgtk/ 2>&1 | tee test-output-xterm.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}-test-logs
          path: |
            test-output-gir-gen.log
            test-output.log
            test-output-xterm.log
            _build/default/gir_gen/test/_build/_tests/

